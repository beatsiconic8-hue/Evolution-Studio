
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution Studio | SEO to Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #e5e5e5;
      overflow-x: hidden;
    }
    .font-brand {
      font-family: 'Playfair Display', serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }

    /* Cinematic Motion Engine */
    @keyframes ken-burns {
      0% { transform: scale(1) translate(0, 0); }
      25% { transform: scale(1.1) translate(-1%, -1%); }
      50% { transform: scale(1.05) translate(1%, -1%); }
      75% { transform: scale(1.15) translate(-1%, 1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes light-leak {
      0% { transform: translateX(-100%) skewX(-15deg); opacity: 0; }
      20% { opacity: 0.4; }
      50% { opacity: 0.1; }
      80% { opacity: 0.4; }
      100% { transform: translateX(200%) skewX(-15deg); opacity: 0; }
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-1%, -1%); }
      30% { transform: translate(1%, -1%); }
      50% { transform: translate(-0.5%, 0.5%); }
      70% { transform: translate(1%, 1%); }
      90% { transform: translate(-1%, 1%); }
    }

    .animate-ken-burns {
      animation: ken-burns 30s ease-in-out infinite;
      will-change: transform;
    }

    .light-leak-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(99, 102, 241, 0.15), transparent);
      animation: light-leak 8s infinite linear;
      pointer-events: none;
      z-index: 10;
    }

    .grain-overlay {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-image: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.04;
      pointer-events: none;
      z-index: 5;
      animation: grain 1s steps(10) infinite;
    }

    .glass-card {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
